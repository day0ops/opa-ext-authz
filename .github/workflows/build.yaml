name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt
  IMAGE: opa-ext-authz

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Check formatting
        run: opa fmt --list --diff policies/

      - name: Static check
        run: opa check policies/

      - name: Unit tests
        run: opa test policies/ -v

      - name: Compute build metadata
        id: meta
        run: |
          version="$(git describe --tags --always --dirty)"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.REPO }}/${{ env.IMAGE }}:latest
